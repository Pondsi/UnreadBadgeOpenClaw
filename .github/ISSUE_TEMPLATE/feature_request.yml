name: Feature request
description: Suggest a capability or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        UnreadBadgeOpenClaw stays deliberately small: two Node scripts that talk
        to the local OpenClaw gateway RPC and write one state file. Requests that
        keep that boundary are much easier to accept.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false
  - type: checkboxes
    id: boundary
    attributes:
      label: Package boundary
      options:
        - label: This can be done without adding external network access or new file-write targets
          required: false
